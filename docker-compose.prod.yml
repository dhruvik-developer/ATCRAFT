# =============================================================================
# DEPLOYED overlay - used by BOTH independent deployments
#
#   scripts/deploy.sh main up
#   scripts/deploy.sh dev  up
#
# The two deployments run this identical overlay. Everything that differs
# between them comes from deploy/<name>.env: the project name (which is the
# isolation boundary), the loopback port, the secrets, the resource sizes.
# Nothing environment-specific is written here, because a difference encoded in
# the overlay is a difference both deployments silently share.
#
# Rules enforced here (section 48):
#   - no source bind-mounts (images contain the built application)
#   - production build targets, non-root users
#   - bounded resources - CPU as well as memory, so neither deployment can
#     starve the other - restart policies, controlled log rotation
#   - exactly ONE published port, bound to loopback, from nginx alone
#
# TLS, the public hostname and HSTS are NOT here. They belong to the host
# nginx (infrastructure/nginx/host/), for two reasons: two containers cannot
# both bind :443 on one box, and a certificate renewed in one place is a
# certificate that cannot go stale in the other.
# =============================================================================

services:
  postgres:
    # No published port at all. The database is reachable only from this
    # deployment's own bridge network - which is the mechanism that stops
    # deployment 1 from opening deployment 2's database, and is worth more than
    # any password. Reach it with:
    #   scripts/deploy.sh <name> psql
    deploy:
      resources:
        limits:
          cpus: ${PG_CPU_LIMIT:-1.5}
          memory: ${PG_MEM_LIMIT:-2G}
    logging: &prod-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    # Also unpublished. The dev overlay publishes Redis for local development;
    # a deployment never does. An unauthenticated Redis on a public interface is
    # remote code execution, and this one is deliberately unauthenticated
    # because nothing outside its own network can address it.
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-0.5}
          memory: ${REDIS_MEM_LIMIT:-1500M}
    logging: *prod-logging

  backend:
    build:
      target: production
    command: ["gunicorn", "src.main:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--workers", "${GUNICORN_WORKERS:-4}", "--bind", "0.0.0.0:8000", "--timeout", "60", "--graceful-timeout", "30", "--max-requests", "2000", "--max-requests-jitter", "200", "--access-logfile", "-"]
    environment:
      # Explicitly not APP_ENV: the deployment's env file sets that, because
      # deployment 2 is a real deployment of the dev branch and may legitimately
      # run with APP_ENV=staging and debug off.
      APP_DEBUG: "false"
      LOG_JSON: "true"
      CACHE_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPU_LIMIT:-2}
          memory: ${BACKEND_MEM_LIMIT:-2G}
    logging: *prod-logging

  celery-worker:
    build:
      target: production
    # Batch work only. `task_routes` already sorts tasks by shape, but one
    # worker consuming every queue made that sorting decorative: with
    # prefetch 1 and concurrency 4, four concurrent MRP runs fill every slot and
    # a password-reset e-mail waits behind a ten-minute plan. The queues are
    # split across two workers below so the separation actually separates.
    command: ["celery", "-A", "src.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_CONCURRENCY:-4}", "--max-tasks-per-child=200", "-n", "batch@%h", "-Q", "default,mrp,reports"]
    environment:
      LOG_JSON: "true"
      # A prefork child builds its own engine, so this is multiplied by
      # CELERY_CONCURRENCY. Half the API's pool: a task holds one connection for
      # its own work, where a web worker interleaves several requests.
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-5}
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-1}
          memory: ${WORKER_MEM_LIMIT:-2G}
    logging: *prod-logging

  celery-notify:
    build:
      target: production
    environment:
      LOG_JSON: "true"
      DB_POOL_SIZE: ${NOTIFY_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${NOTIFY_DB_MAX_OVERFLOW:-2}
    deploy:
      resources:
        limits:
          cpus: ${NOTIFY_CPU_LIMIT:-0.5}
          memory: ${NOTIFY_MEM_LIMIT:-512M}
    logging: *prod-logging

  celery-beat:
    build:
      target: production
    environment:
      LOG_JSON: "true"
      # Beat reads the schedule and publishes; it runs no business query, so a
      # pool of one plus one is ample and returns 18 connections to the budget.
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "1"
    # Beat schedules; it never executes a task. A quarter of a core is generous.
    deploy:
      resources:
        limits:
          cpus: ${BEAT_CPU_LIMIT:-0.25}
          memory: ${BEAT_MEM_LIMIT:-256M}
    logging: *prod-logging

  frontend:
    build:
      target: production
    # Static files behind the deployment's nginx: it needs almost nothing, and
    # a ceiling means a runaway cannot take the box from the other deployment.
    deploy:
      resources:
        limits:
          cpus: ${FRONTEND_CPU_LIMIT:-0.5}
          memory: ${FRONTEND_MEM_LIMIT:-128M}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *prod-logging

  nginx:
    # The one door into this deployment, and it opens on loopback only: the
    # host nginx proxies to it, nothing off-box can reach it directly even if a
    # firewall rule is forgotten. 0.0.0.0 here would publish the whole
    # application, unencrypted, on a port nobody remembers opening.
    ports:
      - "127.0.0.1:${HTTP_PORT:?HTTP_PORT must be set - each deployment needs its own}:80"
    deploy:
      resources:
        limits:
          cpus: ${EDGE_CPU_LIMIT:-1}
          memory: ${EDGE_MEM_LIMIT:-256M}
    logging: *prod-logging
