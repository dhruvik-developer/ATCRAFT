# =============================================================================
# ATCRAFT MANUFACTURING ERP - base Docker Compose topology
#
# Service boundaries are IDENTICAL across every deployment (master rules
# section 49A). Only runtime configuration changes between overlays:
#
#   development:
#     make dev          hybrid - Postgres and Redis here, API and Vite on the host
#     make dev-docker   full Docker         (Windows: .\make.ps1 dev / dev-docker)
#   deployed (behind the host nginx):
#     ./scripts/deploy.sh <main|dev> up
#
# Each wraps this file plus the matching overlay and supplies the project name;
# a bare `docker compose up` fails on the ${COMPOSE_PROJECT_NAME:?} guard
# explained below.
#
# Frontend and backend are ALWAYS separate containers. Never combined.
#
# -----------------------------------------------------------------------------
# TWO INDEPENDENT DEPLOYMENTS ON ONE HOST
# -----------------------------------------------------------------------------
# The isolation boundary is the Compose *project name*. One project name gets
# its own containers, its own bridge network and its own named volumes, so
# `postgres` and `redis` resolve to that deployment's instances and to nothing
# else. Deployment 1 cannot address deployment 2's database because the name
# does not exist on its network.
#
# That is why nothing here is named by hand:
#
#   * no `container_name:` - a fixed name is claimed host-wide, so the second
#     deployment fails with "container name is already in use". Compose names
#     containers <project>-<service>-N instead, unique per project.
#   * no fixed top-level `name:` - it would put both deployments in ONE project,
#     which means one set of volumes: deployment 2 would mount, and migrate,
#     deployment 1's database. This is the failure the whole design exists to
#     prevent, and it is silent - the stack comes up perfectly.
#   * no fixed host ports - see the overlays; a second deployment binding the
#     same port cannot start.
#
# Use scripts/deploy.sh, which sets COMPOSE_PROJECT_NAME from the deployment's
# env file and refuses to run without one.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be set - run via scripts/deploy.sh}

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-atcraft_erp}
  POSTGRES_USER: ${POSTGRES_USER:-atcraft}
  # No default. A shared fallback password is a shared credential across every
  # deployment that forgot to set one, which is how one box's test database
  # ends up openable with the password from another box's production.
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  # Hosts `postgres` and `redis` resolve on this project's network only.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atcraft}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atcraft_erp}
  DATABASE_SYNC_URL: postgresql+psycopg://${POSTGRES_USER:-atcraft}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atcraft_erp}
  REDIS_URL: redis://redis:6379/0
  # --- Database pool, per process -------------------------------------------
  # Every gunicorn worker and every Celery child builds its own engine, so the
  # ceiling is (processes x (pool + overflow)). Sized here rather than left to
  # the application default because the arithmetic has to be reconcilable with
  # PG_MAX_CONNECTIONS below, and it was not before: 4 workers + 4 Celery
  # children + beat wanted 180 connections against a fallback of 100.
  #
  #   backend        GUNICORN_WORKERS x (10 + 10)
  #   celery-worker  CELERY_CONCURRENCY x (5 + 5)     - overridden per service
  #   celery-beat    1 x (1 + 1)                      - it schedules, it does not query
  #
  # See ONE-BOX-RUNBOOK.md, "Connections and memory".
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  # How often the allocation top-up reserves newly arrived stock for short
  # sales orders (docs/assumptions.md section E1-2).
  SO_TOPUP_INTERVAL_SECONDS: ${SO_TOPUP_INTERVAL_SECONDS:-900}
  # Per deployment, and never shared: a token minted by one deployment must not
  # authenticate against the other. The issuer and audience make that a
  # deliberate rejection rather than an accident of key rotation.
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  # Independent from JWT signing so rotating login keys does not make every
  # encrypted TOTP seed unreadable.
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
  JWT_ISSUER: ${JWT_ISSUER:-atcraft-erp}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-atcraft-erp-api}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  # Explicit host allow-list for deployed environments.  localhost/backend are
  # added by the application for internal readiness probes; public hosts come
  # from this value or, for compatibility, from CORS_ORIGINS.
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  # Password-reset and opted-in notification mail. Production/staging fail
  # closed when the provider or required SMTP identity is missing.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Atcraft Manufacturing ERP}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
  # Optional server-side exception reporting. The runtime image contains the
  # SDK; an empty DSN keeps it completely disabled.
  SENTRY_DSN: ${SENTRY_DSN:-}
  STORAGE_PATH: /storage
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    environment:
      <<: *postgres-env
      # Deterministic collation so index ordering never drifts between hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      # The initial migration creates 103 tables, 643 indexes, 590 foreign keys
      # and 556 check constraints inside ONE transaction, and every object taken
      # needs a lock slot. The default of 64 is nowhere near enough: it fails
      # with "out of shared memory / You might need to increase
      # max_locks_per_transaction", which reads like a memory problem and is not.
      # The same applies to the test harness, which builds the full metadata in
      # one transaction.
      - -c
      - max_locks_per_transaction=1024
      # Sized from the deployment's env file, not hardcoded: two deployments
      # share one box's RAM, and two clusters each claiming 1GB of
      # shared_buffers oversubscribe it between them.
      - -c
      # 150, not 100: the default pool sizing above wants 122 connections, so
      # a deployment that never set this used to exhaust the ceiling under load.
      - max_connections=${PG_MAX_CONNECTIONS:-150}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      # The planner's cost model still defaults to 1990s hardware: a random
      # page read is priced at 4x a sequential one, which is roughly true of a
      # spinning disk and roughly 40x too pessimistic on the NVMe this actually
      # runs on. The effect is systematic and quiet - the planner keeps choosing
      # a sequential scan over an index it has, on exactly the large tables
      # where the index matters. This schema has 643 indexes; pricing them
      # correctly is the cheapest performance work available.
      #
      # Measured on a 500k-row stand-in for the inventory ledger, one ordinary
      # tenant-scoped list query: at 4.0 the planner picks a bitmap heap scan
      # over 124k rows and hash-joins it, 84 ms; at 1.1 it picks a nested loop
      # of 200 index lookups, 30 ms. Same query, same data, same index.
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      # How many concurrent reads the storage can usefully service. 1 is the
      # single-spindle default; SSDs are queue devices and want a real number.
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      # Without this, pg_stat_statements' blk_read_time and blk_write_time are
      # always zero and EXPLAIN (ANALYZE, BUFFERS) reports no I/O timings - so
      # the question "is this query slow because of I/O or CPU" has no answer,
      # which is the first question worth asking about a slow query. The cost is
      # two clock reads per block access; on any host with a TSC clocksource
      # that is tens of nanoseconds. Verify with `pg_test_timing` if a host
      # behaves oddly, and set PG_TRACK_IO_TIMING=off if it does.
      - -c
      - track_io_timing=${PG_TRACK_IO_TIMING:-on}
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-500}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    volumes:
      # PostgreSQL 18+ images place data in a major-version subdirectory of
      # /var/lib/postgresql. Mounting at .../data (the pre-18 convention) makes
      # the entrypoint refuse to start, and would break `pg_upgrade --link`
      # across a mount boundary at the next major upgrade.
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # "container started" is not "service ready" (section 49A).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atcraft} -d ${POSTGRES_DB:-atcraft_erp}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [internal]
    restart: unless-stopped

  # ------------------------------------------------------------------- redis
  redis:
    image: redis:7.4.11-alpine3.21@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    # The shared policy lives in the mounted file; the memory ceiling is the
    # one thing that differs per deployment, and a command-line argument
    # overrides the config file.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}"]
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      # Probe over the bridge address the clients use, not loopback. A bare
      # `redis-cli ping` connects to 127.0.0.1, which is exactly the path that
      # stays green in the protected-mode failure infrastructure/redis/redis.conf
      # documents: every client is another container, protected mode rejects
      # all of them with -DENIED, and loopback still answers PONG. This probe
      # goes red in that case, so the search starts at Redis and not at the
      # backend whose readiness is the first thing to notice.
      test: ["CMD-SHELL", "redis-cli -h \"$$(hostname -i | cut -d' ' -f1)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  # ----------------------------------------------------------------- backend
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${SOURCE_REVISION:-unknown}
    image: ${IMAGE_PREFIX:-atcraft}/api:${IMAGE_TAG:-local}
    environment: *api-env
    volumes:
      - storage-data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
    restart: unless-stopped

  # ----------------------------------------------------------- celery-worker
  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${SOURCE_REVISION:-unknown}
    image: ${IMAGE_PREFIX:-atcraft}/api:${IMAGE_TAG:-local}
    command: ["celery", "-A", "src.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_CONCURRENCY:-4}", "-Q", "default,mrp,reports"]
    environment: *api-env
    volumes:
      - storage-data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL, not CMD. The exec form runs no shell, so `$HOSTNAME` is
      # passed through as those nine literal characters and the probe asks for
      # a node named `celery@$HOSTNAME`, which will never exist. It fails with
      # "No nodes replied within time constraint" - which reads like a broker
      # or a hung-worker problem, and sent this investigation to Redis first
      # while the worker was answering `pong` the whole time.
      test: ["CMD-SHELL", "celery -A src.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [internal]
    restart: unless-stopped

  # ----------------------------------------------------------- celery-notify
  # A second worker, for the queue whose latency a person notices.
  #
  # `task_routes` sorts tasks by shape into default/mrp/reports/notifications,
  # but one worker consuming every queue made that sorting decorative: with
  # prefetch 1 and concurrency 4, four concurrent MRP runs occupy every slot and
  # a password-reset e-mail waits behind a ten-minute plan. Splitting the queues
  # across two workers is what makes the routing mean something.
  celery-notify:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${SOURCE_REVISION:-unknown}
    image: ${IMAGE_PREFIX:-atcraft}/api:${IMAGE_TAG:-local}
    command: ["celery", "-A", "src.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${NOTIFY_CONCURRENCY:-2}", "--max-tasks-per-child=200", "-n", "notify@%h", "-Q", "notifications"]
    environment: *api-env
    volumes:
      - storage-data:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL for the $HOSTNAME expansion, and the node name must match the
      # `-n notify@%h` above - see celery-worker for what a mismatch looks like.
      test: ["CMD-SHELL", "celery -A src.workers.celery_app:celery_app inspect ping -d notify@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [internal]
    restart: unless-stopped

  # ------------------------------------------------------------- celery-beat
  # Scheduled work: nightly summary-table refresh, stale-reservation sweep,
  # dispatch delay alerts. Present because section 35 scheduled calculations
  # exist.
  celery-beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${SOURCE_REVISION:-unknown}
    image: ${IMAGE_PREFIX:-atcraft}/api:${IMAGE_TAG:-local}
    command: ["celery", "-A", "src.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *api-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Beat MUST declare its own healthcheck, even though it is the one service
    # that serves no HTTP. Without this it inherits the HEALTHCHECK baked into
    # the api image - an HTTP probe of /health/live - and is therefore
    # permanently unhealthy: `up --wait` never returns, and every monitor shows
    # a broken container that is working perfectly.
    #
    # What is checked is the schedule file's freshness. The persistent
    # scheduler creates it at startup and rewrites it as it syncs, so a stale
    # file is the one honest signal that beat has stopped scheduling while its
    # process is still alive. That matters here: nothing else notices, and the
    # symptom is the nightly summary refresh, the stale-reservation sweep and
    # the dispatch delay alerts all quietly not happening.
    #
    # `python -c` rather than pgrep or find: the slim base image ships neither
    # procps nor findutils, and a healthcheck whose command is missing reports
    # unhealthy for the wrong reason.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import glob,os,sys,time; f=glob.glob(\"/tmp/celerybeat-schedule*\"); sys.exit(0 if f and time.time()-max(map(os.path.getmtime,f)) < 900 else 1)'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [internal]
    restart: unless-stopped

  # ---------------------------------------------------------------- frontend
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${SOURCE_REVISION:-unknown}
      args:
        # Relative, so one bundle works behind any hostname - the deployment's
        # own nginx routes /api/v1 to its own backend. An absolute URL here
        # would bake one deployment's domain into the other's bundle.
        VITE_API_BASE_URL: /api/v1
        VITE_APP_RELEASE: ${IMAGE_TAG:-local}
        VITE_ERROR_REPORT_URL: ${VITE_ERROR_REPORT_URL:-}
    image: ${IMAGE_PREFIX:-atcraft}/web:${IMAGE_TAG:-local}
    # Deliberately depends on nothing. This container serves the built bundle
    # off its own filesystem; the browser talks to /api/v1 through the `nginx`
    # service, never through this one, so it has no runtime dependency on the
    # backend at all.
    #
    # Waiting for `backend: service_healthy` cost on both sides. It serialised
    # startup - postgres, then the migrations, then the backend's readiness
    # probe, and only then did a static file server begin its own wait - and it
    # bought nothing back, because depends_on governs startup order and nothing
    # else: a backend that goes unhealthy an hour later does not stop this
    # container, which is the case the dependency looked like it covered. It
    # also meant a backend that never became healthy served *nothing*, not even
    # the SPA that would have shown the user a real error.
    networks: [internal]
    restart: unless-stopped

  # ------------------------------------------------------------------- nginx
  # The deployment's own router: it owns /api routing, per-endpoint rate limits,
  # the SPA fallback and the response security headers. It does NOT terminate
  # TLS and does not know its own public hostname - the host nginx does both,
  # and proxies to the single port this container publishes on loopback.
  #
  # Keeping it means each deployment is complete and testable on its own:
  #   curl http://127.0.0.1:<HTTP_PORT>/healthz
  # answers without the host nginx being configured at all.
  nginx:
    image: nginx:1.30.4-alpine3.24@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in this image `localhost` resolves to ::1
      # first and nginx listens on IPv4 only, so the probe is refused while
      # every real request succeeds. The container reports unhealthy, `up
      # --wait` fails, and nothing is actually wrong with it. The frontend
      # image's own HEALTHCHECK had the same fault - see apps/web/Dockerfile.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    restart: unless-stopped

# Declared explicitly so the per-project name shows up in `docker network ls`
# as <project>_internal, and the boundary is visible rather than implied.
networks:
  internal:
    driver: bridge

# Project-scoped, so these become <project>_postgres-data and so on. Two
# deployments therefore hold two distinct volumes from the same declaration.
volumes:
  postgres-data:
  redis-data:
  storage-data:
