name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify dependency locks match pyproject.toml
        run: |
          pip-compile --quiet --no-header --allow-unsafe --generate-hashes --strip-extras --resolver=backtracking --output-file=requirements.lock pyproject.toml
          pip-compile --quiet --no-header --allow-unsafe --extra=dev --generate-hashes --strip-extras --resolver=backtracking --output-file=requirements-dev.lock pyproject.toml
          git diff --exit-code -- requirements.lock requirements-dev.lock
      - run: pip-audit -r requirements.lock
      - run: ruff check src tests migrations scripts ../../scripts/hooks
      - run: ruff format --check src tests migrations scripts ../../scripts/hooks
      - run: mypy src
      - run: python -m scripts.export_openapi --check
      - run: python -m scripts.export_postman --check
      - run: pytest tests/unit -q

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: atcraft_erp
          POSTGRES_USER: atcraft
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atcraft -d atcraft_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret-not-used-outside-actions-0123456789
      CREDENTIAL_ENCRYPTION_KEY: ci-only-independent-credential-key-0123456789
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: atcraft_erp
      TEST_POSTGRES_DB: atcraft_erp_test
      POSTGRES_USER: atcraft
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_URL: postgresql+asyncpg://atcraft:ci-only-password@127.0.0.1:5432/atcraft_erp
      DATABASE_SYNC_URL: postgresql+psycopg://atcraft:ci-only-password@127.0.0.1:5432/atcraft_erp
      CACHE_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify migrations from an empty database
        run: alembic upgrade head
      - run: pytest tests/integration tests/api -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run contract:check
      - run: npm test -- --no-file-parallelism --maxWorkers=1
      - run: npm run build

  # ---------------------------------------------------------------------------
  # End to end, against a stack this job builds and starts.
  #
  # CLAUDE.md's last trap is a 297-line journey that could not pass its own
  # login and nobody noticed, because nothing ran it. This is what stops that
  # recurring: the specs execute on every push, against the same production
  # images the release job builds, with the schema and the seed applied the way
  # the runbook applies them.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: atcraft-e2e
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-not-used-outside-actions-0123456789
      CREDENTIAL_ENCRYPTION_KEY: ci-only-independent-credential-key-0123456789
      APP_ENV: development
      HTTP_PORT: "18081"
      E2E_BASE_URL: http://127.0.0.1:18081
      E2E_API_URL: http://127.0.0.1:18081/api/v1
      E2E_ADMIN_EMAIL: admin@atcraft.example
      E2E_ADMIN_PASSWORD: ChangeMe!Atcraft2026
      E2E_BOOTSTRAP_PASSWORD: Bootstrap!Atcraft2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # One published port on loopback, exactly as a deployment runs: the specs
      # drive the SPA through the deployment's own nginx rather than the Vite
      # dev server, so what is tested is what is shipped.
      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait

      - name: Apply the schema and the baseline data
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend \
            python -m alembic upgrade head
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend \
            python -m src.core.seed --admin-password "$E2E_BOOTSTRAP_PASSWORD"

      - name: Install the browser
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the journeys
        working-directory: tests/e2e
        run: npx playwright test

      # The report is the only way to read a failure after the runner is gone.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: atcraft-ci
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-not-used-outside-actions-0123456789
      CREDENTIAL_ENCRYPTION_KEY: ci-only-independent-credential-key-0123456789
      APP_ENV: staging
      CORS_ORIGINS: https://ci.invalid
      ALLOWED_HOSTS: ci.invalid
      HTTP_PORT: "18080"
      SOURCE_REVISION: ${{ github.sha }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject tracked runtime storage
        run: test -z "$(git ls-files 'apps/api/storage/**' 'storage/**' ':!:**/.gitkeep')"
      - name: Validate release scripts
        run: bash -n scripts/deploy.sh scripts/check-host-nginx.sh scripts/verify-isolation.sh
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Validate host nginx templates
        run: ./scripts/check-host-nginx.sh --template
      - name: deploy.sh names the env key that still holds a placeholder
        # Every placeholder key except SMTP_HOST is given a real value, so the
        # refusal must name SMTP_HOST. Tested as one concatenated string it
        # could only say "the file", and sent operators back to CORS_ORIGINS.
        run: |
          sed -e 's#^CORS_ORIGINS=.*#CORS_ORIGINS=https://ci.invalid#' \
              -e 's#^ALLOWED_HOSTS=.*#ALLOWED_HOSTS=ci.invalid#' \
              -e 's#^PUBLIC_WEB_URL=.*#PUBLIC_WEB_URL=https://ci.invalid#' \
              -e 's#^EMAIL_FROM_ADDRESS=.*#EMAIL_FROM_ADDRESS=no-reply@ci.invalid#' \
              -e "s#^POSTGRES_PASSWORD=\$#POSTGRES_PASSWORD=$POSTGRES_PASSWORD#" \
              -e "s#^JWT_SECRET=\$#JWT_SECRET=$JWT_SECRET#" \
              -e "s#^CREDENTIAL_ENCRYPTION_KEY=\$#CREDENTIAL_ENCRYPTION_KEY=$CREDENTIAL_ENCRYPTION_KEY#" \
              deploy/main.env.example > deploy/main.env
          chmod 600 deploy/main.env
          if out="$(./scripts/deploy.sh main doctor 2>&1)"; then
            printf '%s\n' "$out" "doctor accepted SMTP_HOST=smtp.example.com"; exit 1
          fi
          printf '%s\n' "$out" | grep -F 'SMTP_HOST in deploy/main.env still holds the example.com placeholder' \
            || { printf '%s\n' "$out" "the refusal did not name SMTP_HOST"; exit 1; }
          rm -f deploy/main.env
      - name: Validate the runbook's installed host nginx path
        # ONE-BOX-RUNBOOK.md step 9, run literally: copy the templates to
        # /etc/nginx, substitute the hostnames with the runbook's own sed lines,
        # then validate the installed copies. --installed must refuse the
        # placeholders before the sed and accept the result after it.
        run: |
          sudo mkdir -p /etc/nginx/conf.d /etc/nginx/snippets
          sudo cp infrastructure/nginx/host/snippets/atcraft-proxy.conf /etc/nginx/snippets/
          sudo cp infrastructure/nginx/host/00-default.conf \
                  infrastructure/nginx/host/atcraft-main.conf \
                  infrastructure/nginx/host/atcraft-dev.conf \
                  /etc/nginx/conf.d/
          if ./scripts/check-host-nginx.sh --installed; then
            echo "--installed accepted example.com placeholders"; exit 1
          fi
          sudo sed -i 's/erp\.example\.com/erp.ci.invalid/g'         /etc/nginx/conf.d/atcraft-main.conf
          sudo sed -i 's/dev\.erp\.example\.com/dev.erp.ci.invalid/g' /etc/nginx/conf.d/atcraft-dev.conf
          ./scripts/check-host-nginx.sh --installed
      - name: Build production images from fresh bases
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build --pull backend frontend
      - name: Scan backend image for high-impact vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atcraft/api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Scan frontend image for high-impact vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atcraft/web:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
