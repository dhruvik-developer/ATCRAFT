version: 2
# The repository keeps only main/develop. Apply reviewed dependency updates on
# develop; CI dependency/image audits continue without automatic PR branches.
updates:
  - package-ecosystem: npm
    directory: /apps/web
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tests/e2e
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /apps/api
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/api
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/web
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  # docker-compose, not docker: the docker ecosystem reads Dockerfiles, and
  # there is none at the root. This is the ecosystem that parses the `image:`
  # references (digest included) in docker-compose*.yml, so the postgres,
  # redis and nginx pins there get the reviewed digest updates the Dockerfile
  # and deploy.sh comments promise.
  - package-ecosystem: docker-compose
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
