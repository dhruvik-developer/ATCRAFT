# =============================================================================
# The deployment's own nginx - one per deployment, behind the host nginx.
#
# It owns: /api routing, per-endpoint rate limits, response security headers,
# the SPA fallback, static-asset caching.
#
# It does NOT own: TLS, the public hostname, HSTS, the http->https redirect.
# Those live in infrastructure/nginx/host/, because two deployments on one box
# cannot both bind :443 and a certificate should be renewed in exactly one
# place. There is deliberately no `return 301 https://...` here: behind a
# TLS-terminating proxy that is an infinite redirect.
# =============================================================================

# --- Recover the real client address ----------------------------------------
# The host nginx is the only thing that can reach this container: the port is
# published on 127.0.0.1 alone, so every connection arrives over the project's
# own docker bridge from a private address. Without this block $remote_addr is
# the bridge gateway - identical for every visitor - which would silently turn
# per-IP rate limiting into one shared bucket for the entire internet and write
# the same useless address into every audit row.
#
# The trusted ranges are the RFC1918 blocks because docker allocates bridge
# subnets from them and the per-project subnet is not known ahead of time.
# That is safe *here* precisely because nothing outside the box can open this
# socket; it would not be safe on a public listener.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
real_ip_header    X-Real-IP;
# Single trusted hop. `on` would walk back through the chain looking for the
# first non-trusted address, which is attacker-controlled data.
real_ip_recursive off;

# --- Correlation id ----------------------------------------------------------
# Honour an inbound id so a trace spans the edge, but only if it looks like an
# id. The value reaches the application log and the response header, so an
# unvalidated one is caller-controlled log content.
map $http_x_request_id $correlation_id {
    default                    $request_id;
    "~^[0-9A-Za-z_.:-]{8,64}$" $http_x_request_id;
}

# --- The scheme the user actually spoke --------------------------------------
# Set by the host nginx. Anything unrecognised falls back to this container's
# own scheme rather than being passed through.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "https" "https";
    "http"  "http";
}

server {
    listen 80;
    # This container does not know its own public hostname, and must not care:
    # the same image and the same config serve both deployments.
    server_name _;

    # --- Upstream addresses, as variables -----------------------------------
    # A variable here is not a style choice. With a literal hostname - or an
    # upstream block - nginx resolves once at startup and caches the address
    # forever, so every container recreation leaves this nginx proxying to an
    # address nothing answers on: 502 for every request, while nginx's own
    # /healthz still returns 200 because it touches no upstream. A variable is
    # re-resolved through the resolver declared in nginx.conf, so a rebuilt
    # backend is picked up without anyone running `nginx -s reload`.
    #
    # These names resolve on THIS deployment's network only, which is what
    # lets both deployments use the identical service names.
    set $atcraft_backend  http://backend:8000;
    set $atcraft_frontend http://frontend:80;

    # --- Upstream timeouts --------------------------------------------------
    # At SERVER level on purpose. These used to live in proxy_params.conf,
    # which is included inside every location - and a location that then set
    # its own proxy_read_timeout gave the directive twice in one context,
    # which nginx refuses outright:
    #
    #   [emerg] "proxy_read_timeout" directive is duplicate
    #
    # Here they are defaults that a location may legally override, which is
    # what the longer per-location values were always for.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # --- Response buffers ----------------------------------------------------
    # Server level, for the same reason as the timeouts above: /api/v1/documents/
    # turns buffering off entirely, and a directive given twice in one context
    # makes nginx refuse to load.
    #
    # The defaults are 4k + 8x4k = 32 KB, and a response past that is written to
    # a temp file and read back - disk I/O on a request path, for every large
    # list.
    #
    # Measured against this deployment, all 85 collection endpoints at
    # page_size=200: with `Accept-Encoding: gzip` - which is every browser - the
    # backend compresses and nginx buffers 5 KB at the largest, so the defaults
    # were never the problem for the SPA. Without it - an integration script, a
    # curl, anything that does not ask for compression - the same responses are
    # 40 KB here and scale with the row count, so on real data they cross 32 KB
    # routinely and start spilling.
    #
    # 16x8k = 128 KB, matching what infrastructure/nginx/host already sets one
    # layer up. Buffers are allocated as a response arrives rather than up front,
    # so this costs nothing on the small responses that are the common case.
    proxy_buffer_size       8k;
    proxy_buffers        16 8k;
    proxy_busy_buffers_size 16k;

    # --- Security headers (section 51) --------------------------------------
    # Strict-Transport-Security is NOT here. It is a statement about how the
    # origin is reached, which only the TLS terminator can honestly make, and
    # duplicating it means two places to get max-age wrong.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    limit_conn conn_per_ip 50;

    # Answers without the host nginx configured, which is what makes a single
    # deployment testable on its own.
    location = /healthz { access_log off; return 200 "ok\n"; }

    # --- Operational probes: on the box, never on the public hostname -------
    # The application serves these at its root, not under /api/v1, so without
    # this block they fall through to `location /` and are answered by the SPA
    # with 200 and an HTML page - a health check that can never fail, which is
    # worse than not having one.
    #
    # The host nginx returns 404 for both paths (see infrastructure/nginx/host/).
    # /health/ready says whether Postgres and Redis are reachable and /metrics
    # publishes request rates and latencies: useful to whoever runs the box,
    # and nobody else's business.
    location ^~ /health/ {
        access_log off;
        proxy_pass $atcraft_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
    location = /metrics {
        access_log off;
        proxy_pass $atcraft_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # --- Authentication endpoints: tighter rate limit -----------------------
    location ~ ^/api/v1/auth/(login|refresh|password-reset) {
        limit_req zone=api_auth burst=30 nodelay;
        proxy_pass $atcraft_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # --- Authenticated file downloads go through the API, never the FS ------
    # section 43: filesystem paths are never exposed.
    # section 44: downloads are authenticated.
    location /api/v1/documents/ {
        proxy_pass $atcraft_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=300 nodelay;
        proxy_pass $atcraft_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
        # Long exports/reports are Celery jobs; the HTTP call itself is short.
        proxy_read_timeout 60s;
    }

    location = /docs         { proxy_pass $atcraft_backend; include /etc/nginx/conf.d/proxy_params.conf; }
    location = /redoc        { proxy_pass $atcraft_backend; include /etc/nginx/conf.d/proxy_params.conf; }
    location = /openapi.json { proxy_pass $atcraft_backend; include /etc/nginx/conf.d/proxy_params.conf; }

    # --- Frontend static assets: content-hashed, cache hard -----------------
    # No `add_header` here, deliberately. nginx inherits the headers from the
    # enclosing block ONLY while the current block adds none of its own: one
    # `add_header` in this location would silently discard every security
    # header set at server level - nosniff, X-Frame-Options, Referrer-Policy,
    # Permissions-Policy and the CSP - for every asset the SPA loads. The
    # frontend container already sends `expires 1y` and
    # `Cache-Control: public, immutable` for /assets/ (apps/web/nginx.conf), so
    # restating them here bought nothing and cost the headers.
    location /assets/ {
        proxy_pass $atcraft_frontend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # --- SPA ----------------------------------------------------------------
    location / {
        proxy_pass $atcraft_frontend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
