# =============================================================================
# Shared proxy headers for the deployment's own nginx.
#
# Every forwarded header here is SET, never appended and never passed through
# from the client. The application reads `x-real-ip` and treats it as the truth
# (src/core/middleware.py uses it as the rate-limit identity, and
# src/modules/auth/router.py records it as the login IP), so whatever arrives
# on that header from outside has to be overwritten before the backend sees it.
# A client that could choose its own X-Real-IP would get a fresh rate-limit
# bucket per request and could write any address it liked into the audit trail.
#
# $remote_addr is the real client here rather than the host nginx, because the
# realip module rewrites it - see the set_real_ip_from block in atcraft.conf.
# =============================================================================
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Overwrite rather than $proxy_add_x_forwarded_for: appending would preserve
# whatever the client put in the header ahead of the real address, and anything
# reading the first element of the chain would read the client's own choice.
proxy_set_header X-Forwarded-For   $remote_addr;
# The scheme the *user* spoke, which is the host nginx's scheme and not this
# container's - inside here it is always plain http.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Request-ID      $correlation_id;
proxy_set_header Connection        "";
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
