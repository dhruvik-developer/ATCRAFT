# =============================================================================
# DEPLOYMENT 2 - "dev" (dev branch, integration testing)
#
# Install to:  /etc/nginx/conf.d/atcraft-dev.conf
# Proxies to:  127.0.0.1:8082   (deploy/dev.env -> HTTP_PORT)
#
# Replace dev.erp.example.com with the real hostname before enabling:
#   sudo sed -i 's/dev.erp.example.com/dev.erp.yourcompany.com/g' \
#     /etc/nginx/conf.d/atcraft-dev.conf
#
# Identical to atcraft-main.conf apart from server_name, the upstream port, the
# certificate paths, and the two additions at the bottom that exist because
# this deployment is not the client's: it is kept out of search indexes and can
# be put behind a password.
# =============================================================================

# Sized and reasoned about in atcraft-main.conf; the two must not diverge.
limit_req_zone $binary_remote_addr zone=dev_edge:10m rate=3000r/m;

# Keepalive pool to the deployment - see atcraft-main.conf for why an upstream
# block is correct here and wrong inside the deployment.
upstream atcraft_dev_upstream {
    server 127.0.0.1:8082;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.erp.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.erp.example.com;

    ssl_certificate     /etc/letsencrypt/live/dev.erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.erp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSLdev:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A dev deployment holds test data that reads like real data. Keeping it out
    # of search results is the cheapest way to stop a made-up customer name
    # being findable next to the client's brand.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 25m;
    client_body_timeout  60s;

    # --- Response buffering -------------------------------------------------
    # At server level, not in the proxy snippet: the snippet is included inside
    # every location and the documents location turns buffering off to stream a
    # download. Both in one context is a duplicate directive, which nginx
    # rejects outright - the whole host config fails to load.
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    # Long enough for a document download streaming out of the API, short
    # enough that a hung upstream is not held open indefinitely. Report and
    # MRP runs are Celery jobs; their HTTP calls return immediately.
    proxy_read_timeout    120s;

    access_log /var/log/nginx/atcraft-dev.access.log;
    error_log  /var/log/nginx/atcraft-dev.error.log warn;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # --- Operational endpoints stay on the box ------------------------------
    # The deployment's own nginx serves /health/ready and /metrics on its
    # loopback port. Published under the public hostname they would tell an
    # anonymous visitor whether the database is reachable and how much traffic
    # the ERP carries - and `location /` below would proxy them happily.
    location ^~ /health/ { access_log off; return 404; }
    location = /metrics  { access_log off; return 404; }

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        limit_req zone=dev_edge burst=300 nodelay;
        # Deployment 2's port. See the note in atcraft-main.conf: swapping
        # these two numbers produces a site that works and serves the wrong
        # database.
        proxy_pass http://atcraft_dev_upstream;
        include /etc/nginx/snippets/atcraft-proxy.conf;

        # --- Optional: put the whole dev deployment behind a password -------
        # Uncomment both lines after creating the file:
        #   sudo apt-get install -y apache2-utils
        #   sudo htpasswd -c /etc/nginx/.htpasswd-atcraft-dev <username>
        # Leave the API's own authentication in place regardless - this is a
        # front door, not an authorisation model.
        # auth_basic           "Atcraft ERP - dev";
        # auth_basic_user_file /etc/nginx/.htpasswd-atcraft-dev;
    }

    # Include the collection itself: a slash-terminated proxy prefix makes
    # nginx redirect it before the API can validate or authenticate the call.
    location ~ ^/api/v1/documents(?:/|$) {
        proxy_pass http://atcraft_dev_upstream;
        include /etc/nginx/snippets/atcraft-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
