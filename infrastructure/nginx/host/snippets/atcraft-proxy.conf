# =============================================================================
# Host nginx -> a deployment's loopback port. Included by every atcraft server
# block; the block itself sets $atcraft_upstream to its own deployment's port.
#
# Install to: /etc/nginx/snippets/atcraft-proxy.conf
#
# This is the trust boundary. Every forwarded header is SET from a value nginx
# derived itself, never from something the client sent:
#
#   X-Real-IP      the application uses this as the rate-limit identity and
#                  writes it into the audit trail, so a client that could
#                  choose it would get one rate-limit bucket per request and
#                  could put any address it liked next to a login.
#   X-Forwarded-For overwritten, not appended. $proxy_add_x_forwarded_for keeps
#                  whatever the client put in front of the real address.
#   X-Forwarded-Proto the deployment has no TLS of its own and cannot work this
#                  out; secure-cookie and absolute-URL decisions depend on it.
# =============================================================================

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

# The deployment's nginx re-derives everything from the headers above; nothing
# the client sent on these names may survive the hop.
proxy_set_header X-Forwarded-Server "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
# Long enough for a document download streaming out of the API, short enough
# that a hung upstream is not held open indefinitely. Report and MRP runs are
# Celery jobs; their HTTP calls return immediately.
proxy_read_timeout    120s;

# Buffer responses, except where the location turns it off for a download.
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 16 8k;
