# Reject requests for any hostname but the configured Atcraft deployment's.
# Without an explicit default server nginx routes an unknown Host/SNI value to
# whichever application vhost was loaded first.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # nginx 1.19.4+ can reject the TLS handshake without presenting the
    # deployment's certificate to an unknown SNI name.
    ssl_reject_handshake on;
}
