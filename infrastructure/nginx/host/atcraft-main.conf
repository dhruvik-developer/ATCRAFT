# =============================================================================
# DEPLOYMENT 1 - "main" (main branch, the client's environment)
#
# Install to:  /etc/nginx/conf.d/atcraft-main.conf
# Proxies to:  127.0.0.1:8081   (deploy/main.env -> HTTP_PORT)
#
# Replace erp.example.com with the real hostname before enabling:
#   sudo sed -i 's/erp.example.com/erp.yourcompany.com/g' \
#     /etc/nginx/conf.d/atcraft-main.conf
#
# This file and atcraft-dev.conf differ in exactly three things: server_name,
# the upstream port, and the certificate paths. Nothing else should diverge -
# a difference between the two host blocks is a difference between the two
# deployments that no test will catch.
# =============================================================================

# --- Rate limiting at the edge ----------------------------------------------
# The deployment's own nginx also rate-limits, and both are wanted: this zone
# is per-host and sheds load before it costs a proxy hop, while the in-stack
# zone protects the API even if the host nginx is bypassed or replaced. The
# zone names are suffixed per deployment because a shared zone would let
# traffic to one deployment throttle the other.
#
# $binary_remote_addr is a *site*, not a person - the whole plant shares one
# NAT address - so this cannot be a fair per-user budget and must not be sized
# as though it were. Fairness is the application's job, where the budget is
# keyed on the authenticated user (RATE_LIMIT_DEFAULT_PER_MINUTE). This zone's
# job is shedding a flood, and it is sized to sit safely above a real office:
#
#     50 users x ~30 req/min of real navigation = 1500 r/m = 25 r/s
#     this ceiling                              = 3000 r/m = 50 r/s
#
# The previous 600r/m sat *below* that office and would have started refusing
# requests during an ordinary busy morning - as 429s, which the SPA can only
# report as a failure to the person who did nothing wrong.
limit_req_zone $binary_remote_addr zone=main_edge:10m rate=3000r/m;

# --- Upstream, with a kept-alive connection pool -----------------------------
# Without this the host nginx opens a fresh TCP connection to the deployment for
# every single request and closes it again: a handshake, a close, and a socket
# left in TIME_WAIT, all to travel from loopback to loopback. On a busy morning
# that is tens of thousands of sockets accumulating for no work done.
#
# An `upstream` block is safe HERE and is deliberately NOT used inside the
# deployment (infrastructure/nginx/conf.d/atcraft.conf uses a variable in
# proxy_pass instead). The difference is what is being named: that file names a
# *container*, whose address changes on every deploy, and nginx resolves an
# upstream name once and caches it for ever - which is how an ordinary rebuild
# turned into a total outage. This file names 127.0.0.1, which is a literal
# address that no deploy can change and no resolver is involved in. The
# published port moves only when deploy/main.env changes, which is an edit to
# this file's neighbour and a reload either way.
#
# The keepalive itself needs `proxy_http_version 1.1` and `Connection ""`, both
# already set in snippets/atcraft-proxy.conf.
upstream atcraft_main_upstream {
    server 127.0.0.1:8081;

    # 32 idle connections is comfortably more than four gunicorn workers can be
    # busy with at once, so a request effectively never waits for one.
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;

    # ACME renewal must stay reachable on plain HTTP, ahead of the redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.example.com;

    # --- TLS ----------------------------------------------------------------
    # Terminated here and only here. The deployment containers speak plain HTTP
    # on loopback, so this is the single place a certificate is renewed.
    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSLmain:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS belongs to the TLS terminator: it is a promise about how this origin
    # is reached, and only the thing doing the reaching can make it honestly.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Uploads: aligned with MAX_UPLOAD_SIZE_MB. Too small here and a legitimate
    # drawing upload fails at the edge with a 413 the application never sees.
    client_max_body_size 25m;
    client_body_timeout  60s;

    # --- Response buffering -------------------------------------------------
    # At server level, not in the proxy snippet: the snippet is included inside
    # every location and the documents location turns buffering off to stream a
    # download. Both in one context is a duplicate directive, which nginx
    # rejects outright - the whole host config fails to load.
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    # Long enough for a document download streaming out of the API, short
    # enough that a hung upstream is not held open indefinitely. Report and
    # MRP runs are Celery jobs; their HTTP calls return immediately.
    proxy_read_timeout    120s;

    access_log /var/log/nginx/atcraft-main.access.log;
    error_log  /var/log/nginx/atcraft-main.error.log warn;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # --- Operational endpoints stay on the box ------------------------------
    # The deployment's own nginx serves /health/ready and /metrics on its
    # loopback port. Published under the public hostname they would tell an
    # anonymous visitor whether the database is reachable and how much traffic
    # the ERP carries - and `location /` below would proxy them happily.
    location ^~ /health/ { access_log off; return 404; }
    location = /metrics  { access_log off; return 404; }

    location / {
        limit_req zone=main_edge burst=300 nodelay;
        # Deployment 1's port, and no other. Pointing this at 8082 would serve
        # the dev branch and the dev database under the production hostname -
        # the single most damaging typo available in this file, and one that
        # produces a working site.
        proxy_pass http://atcraft_main_upstream;
        include /etc/nginx/snippets/atcraft-proxy.conf;
    }

    # Document downloads stream out of the API; buffering them costs memory and
    # delays the first byte.
    location /api/v1/documents/ {
        proxy_pass http://atcraft_main_upstream;
        include /etc/nginx/snippets/atcraft-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
