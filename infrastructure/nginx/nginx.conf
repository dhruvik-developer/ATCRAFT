# =============================================================================
# Atcraft ERP - Nginx main configuration (master rules section 49)
# Responsibilities: HTTPS termination, routing, compression, request-size
# limits, basic rate limiting, security headers, static asset handling.
# =============================================================================
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logging: carry the correlation id end to end (section 55) ----------
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,'
      '"body_bytes":$body_bytes_sent,"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"request_id":"$request_id","referer":"$http_referer",'
      '"user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # --- Request size limits ------------------------------------------------
    client_max_body_size 25m;          # aligned with MAX_UPLOAD_SIZE_MB
    client_body_timeout  30s;
    client_header_timeout 15s;
    large_client_header_buffers 4 16k;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/javascript application/json application/xml
        text/css text/plain text/xml image/svg+xml
        application/vnd.api+json;

    # --- Rate limiting (section 51) -----------------------------------------
    # Zones are declared here; enforcement is per-location in conf.d.
    #
    # These are keyed on the client address, and an address is a *site*, not a
    # person: every user in the plant arrives from one NAT address. So nothing
    # here can be a fair per-user budget, and it must not pretend to be one -
    # that job belongs to the application, which keys its budget on the
    # authenticated user (RATE_LIMIT_DEFAULT_PER_MINUTE, 300/min = 5 r/s each)
    # and can therefore be both strict and fair.
    #
    # What is left for nginx is the job it can actually do: shed a flood before
    # it costs a proxy hop. Sized accordingly -
    #
    #   realistic sustained peak, one office of 50 behind one NAT:
    #       50 users x ~30 req/min of real navigation  = 1500 r/m = 25 r/s
    #   this ceiling:                                    3000 r/m = 50 r/s
    #
    # - twice the busiest plausible office, so it never binds on real work, and
    # still an order of magnitude under a scraper or a runaway retry loop. The
    # previous 120r/m was below what a *single* operator generates: one detail
    # page plus a dialog is about ten requests, so a clerk working properly was
    # the first person to be told to slow down.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=3000r/m;
    # Sign-in, deliberately above the application's own per-address login budget
    # (RATE_LIMIT_AUTH_PER_MINUTE, 20/min) so that knob is the one that binds -
    # it is the tunable a deployment is told to raise, and a lower ceiling here
    # would silently make raising it do nothing. Credential stuffing is stopped
    # per account, not here: LOGIN_PER_EMAIL and the account lockout.
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=60r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # --- Upstream name resolution -------------------------------------------
    # Docker's embedded DNS server. Every deployment gets one at this address
    # on its own bridge network, which is what makes `backend` resolve to that
    # deployment's backend and to nothing else.
    #
    # This replaces two `upstream` blocks, and the reason is worth stating
    # because the alternative looks better and is not:
    #
    # nginx resolves the hostname in an `upstream ... server` directive ONCE,
    # at configuration load, and caches the address for the lifetime of the
    # process. Container IPs change every time a container is recreated - which
    # is what a deploy does - and Compose does not restart dependents when a
    # dependency is replaced. So after `up` rebuilt the backend, nginx held the
    # previous address and answered 502 to every API request while reporting
    # itself healthy, because its own /healthz never touches an upstream. Total
    # API outage, on an ordinary deploy, requiring `nginx -s reload` that
    # nobody knew to run.
    #
    # With `resolver` plus a variable in proxy_pass (see conf.d/atcraft.conf),
    # nginx re-resolves on its own schedule and recovers by itself.
    #
    # The trade-off, honestly: a variable proxy_pass cannot use an upstream
    # block, so upstream keepalive is gone and each proxied request opens a
    # connection to the backend. On a shared bridge network that is tens of
    # microseconds, and it buys correctness under any restart order - which is
    # the right way round for a system somebody else operates.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
