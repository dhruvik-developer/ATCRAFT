# =============================================================================
# Atcraft ERP - Nginx main configuration (master rules section 49)
# Responsibilities: HTTPS termination, routing, compression, request-size
# limits, basic rate limiting, security headers, static asset handling.
# =============================================================================
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logging: carry the correlation id end to end (section 55) ----------
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,'
      '"body_bytes":$body_bytes_sent,"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"request_id":"$request_id","referer":"$http_referer",'
      '"user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # --- Request size limits ------------------------------------------------
    client_max_body_size 25m;          # aligned with MAX_UPLOAD_SIZE_MB
    client_body_timeout  30s;
    client_header_timeout 15s;
    large_client_header_buffers 4 16k;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/javascript application/json application/xml
        text/css text/plain text/xml image/svg+xml
        application/vnd.api+json;

    # --- Rate limiting (section 51) -----------------------------------------
    # Zones are declared here; enforcement is per-location in conf.d.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # --- Upstreams ----------------------------------------------------------
    upstream atcraft_backend {
        server backend:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }
    upstream atcraft_frontend {
        server frontend:80 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
