proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $correlation_id;
proxy_set_header Connection        "";

# The proxy timeouts are NOT here. This file is included inside every
# location, so a timeout set here and again in a location is the same
# directive twice in one context - which nginx rejects. They are set at
# server level in atcraft.conf instead.
