# Development server block: plain HTTP, Vite dev server with websocket HMR.
map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name localhost;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
        proxy_pass http://atcraft_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_read_timeout 120s;
    }
    location = /docs         { proxy_pass http://atcraft_backend; include /etc/nginx/conf.d/proxy_params.conf; }
    location = /redoc        { proxy_pass http://atcraft_backend; include /etc/nginx/conf.d/proxy_params.conf; }
    location = /openapi.json { proxy_pass http://atcraft_backend; include /etc/nginx/conf.d/proxy_params.conf; }

    # Vite dev server - HMR requires the websocket upgrade headers.
    location / {
        proxy_pass http://frontend:5173;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
