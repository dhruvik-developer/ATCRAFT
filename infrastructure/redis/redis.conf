# =============================================================================
# Atcraft ERP - Redis base configuration
#
# Mounted read-only into every deployment's Redis container. Per-deployment
# differences (memory ceiling) are passed as command-line arguments by the
# compose overlay, which Redis treats as overrides of anything set here - so
# this file states the shared policy and nothing environment-specific.
#
# Redis is a cache and a queue broker. It is NEVER the source of truth: every
# key in it can be dropped and rebuilt from PostgreSQL. That is what makes
# `allkeys-lru` the correct eviction policy rather than `noeviction`.
# =============================================================================

# --- Network -----------------------------------------------------------------
# Bind all interfaces *inside the container*: the only reachable interface is
# the deployment's own private bridge network, and in production no host port
# is published at all. Protected mode stays on as a second line of defence.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0

# --- Memory ------------------------------------------------------------------
# maxmemory is deliberately absent - the compose overlay supplies it, because
# two deployments sharing one box must not each claim the same ceiling.
maxmemory-policy allkeys-lru

# --- Durability --------------------------------------------------------------
# The append-only file exists so a restart does not lose queued Celery jobs
# mid-flight. `everysec` is the right trade here: a job is re-derivable from the
# database, so a one-second window is cheaper than fsync-per-write.
appendonly yes
appendfsync everysec
dir /data

# RDB snapshots back up the AOF for faster cold starts.
save 900 1
save 300 10

# --- Operational safety ------------------------------------------------------
# The two commands that can wipe an instance outright are renamed out of
# existence. Nothing in this application calls them, and on a box running two
# deployments a FLUSHALL aimed at the wrong container is a realistic accident
# rather than a hypothetical attack.
rename-command FLUSHALL ""
rename-command FLUSHDB  ""

# KEYS and CONFIG are deliberately NOT renamed. The application only ever uses
# SCAN (see src/core/cache.py), so renaming them looks free - but Celery's
# Redis backend calls CONFIG GET maxmemory to check the eviction policy, and
# its inspect commands use KEYS. Renaming those breaks the worker, and breaks
# it in the half-working way that is noticed weeks later.

# Slow query visibility (master rules section 30 applies to Redis too).
slowlog-log-slower-than 10000
slowlog-max-len 128
