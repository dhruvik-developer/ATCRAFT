# =============================================================================
# LOCAL DEVELOPMENT overlay - a developer's machine, NOT a deployment
#
# This is the third stack on the box and the only one that publishes a database
# port. It exists so the host-run API, the host-run Vite server and pytest can
# all reach Postgres and Redis. The two real deployments (deploy/main.env,
# deploy/dev.env) publish nothing but one HTTP port; do not confuse
# "deployment 2 is the dev branch" with "this file".
#
# Mode 1 - Hybrid (preferred daily driver): infrastructure only.
#   make dev            # brings up postgres + redis, then API and web on the host
#
# Mode 2 - Full Docker development, with hot reload through nginx:
#   make dev-docker
#
# Source is bind-mounted here for hot reload. NEVER in a deployment (section 49A).
#
# Every published port is bound to 127.0.0.1. On 0.0.0.0 - which is what a bare
# "5432:5432" means - a laptop on a cafe network is serving an unauthenticated
# Redis and a Postgres with the development password to the whole subnet.
# =============================================================================

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    command:
      - postgres
      # See docker-compose.yml: the initial migration takes more locks in
      # one transaction than the default 64 slots allow.
      - -c
      - max_locks_per_transaction=1024
      - -c
      - log_min_duration_statement=200   # surface slow queries during dev (section 30)
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  backend:
    build:
      target: development
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      LOG_JSON: "false"
      DB_ECHO: "false"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost"
    volumes:
      - ./apps/api/src:/app/src              # hot reload
      - ./apps/api/tests:/app/tests
      - ./apps/api/migrations:/app/migrations
      - ./storage:/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  celery-worker:
    build:
      target: development
    # --pool=solo keeps tracebacks readable and reloads predictable in dev.
    command: ["watchfiles", "--filter", "python", "celery -A src.workers.celery_app:celery_app worker --loglevel=INFO --pool=solo", "/app/src"]
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
    volumes:
      - ./apps/api/src:/app/src
      - ./storage:/storage

  celery-beat:
    build:
      target: development
    volumes:
      - ./apps/api/src:/app/src

  frontend:
    build:
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_BASE_URL: /api/v1
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
      - ./apps/web/vite.config.ts:/app/vite.config.ts
      - ./apps/web/tailwind.config.ts:/app/tailwind.config.ts
      # Anonymous volume keeps container node_modules from being shadowed
      # by the host directory (host is often a different platform/arch).
      - /app/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d.dev:/etc/nginx/conf.d:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
