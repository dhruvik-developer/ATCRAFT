# Static asset server inside the frontend container.
# The edge nginx (infrastructure/nginx) terminates TLS and routes /api to the
# backend; this one only serves the built SPA.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html must NEVER be cached: it is the document that points at the
    # current asset hashes, and a stale copy pins users to a deleted bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA fallback - client-side routes are not files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    # nginx defaults to level 1. The edge never recompresses an already
    # encoded upstream body, so this is the level users actually download at,
    # and the bundle budgets are measured at a comparable ratio.
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;
}
